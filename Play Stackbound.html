<script>
// hosted on the web (and added to a home screen): keep a copy of every file so the game plays offline.
// Opened as a file from the zip, none of this runs. A new build reloads on the title screen once it is cached.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && window.SB && SB.UI && SB.UI.screen === 'title') location.reload(); had = true; });
}
</script>
